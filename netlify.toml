[build]
  command = "npm run build"
  publish = "dist"

# Prerendered routes are real files and are served first.
# Unknown URLs get the static 404 page with a 404 status.

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
