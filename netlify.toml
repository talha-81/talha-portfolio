[build]
  command = "npm run build"
  publish = "dist"

# Routes are flat HTML files (about.html, projects/vehicle-detection.html).
# The build writes dist/_redirects so /about rewrites to /about.html with
# status 200. A contact/index.html publish would 301 /contact to /contact/.
# The last generated rule sends unknown paths to /404.html with status 404.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
